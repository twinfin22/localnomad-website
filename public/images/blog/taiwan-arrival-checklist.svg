<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="gradient-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065F46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
        <defs>
          <pattern id="pattern-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="20" cy="20" r="3" fill="#10B981" opacity="0.1"/>
          </pattern>
        </defs>
      
  </defs>
  
  <!-- Background gradient -->
  <rect width="960" height="480" fill="url(#gradient-main)"/>
  
  <!-- Pattern overlay -->
  <rect width="960" height="480" fill="url(#pattern-dots)"/>
  
  <!-- Subtle accent accent overlay -->
  <circle cx="100" cy="80" r="120" fill="#10B981" opacity="0.08"/>
  <circle cx="850" cy="420" r="150" fill="#10B981" opacity="0.06"/>
  
  <!-- Country emoji positioned subtly -->
  <text x="480" y="240" font-size="200" text-anchor="middle" dominant-baseline="middle" opacity="0.15">
    🇹🇼
  </text>
  
  <!-- Subtle accent bar -->
  <line x1="0" y1="480" x2="960" y2="480" stroke="#10B981" stroke-width="3" opacity="0.3"/>
</svg>