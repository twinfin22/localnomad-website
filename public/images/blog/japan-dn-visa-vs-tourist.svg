<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="gradient-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312E81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E35B1;stop-opacity:1" />
    </linearGradient>
    
        <defs>
          <pattern id="pattern-hexagons" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
            <polygon points="40,10 60,20 60,40 40,50 20,40 20,20" fill="none" stroke="#7E57C2" stroke-width="1" opacity="0.12"/>
          </pattern>
        </defs>
      
  </defs>
  
  <!-- Background gradient -->
  <rect width="960" height="480" fill="url(#gradient-main)"/>
  
  <!-- Pattern overlay -->
  <rect width="960" height="480" fill="url(#pattern-hexagons)"/>
  
  <!-- Subtle accent accent overlay -->
  <circle cx="100" cy="80" r="120" fill="#7E57C2" opacity="0.08"/>
  <circle cx="850" cy="420" r="150" fill="#7E57C2" opacity="0.06"/>
  
  <!-- Country emoji positioned subtly -->
  <text x="480" y="240" font-size="200" text-anchor="middle" dominant-baseline="middle" opacity="0.15">
    🇯🇵
  </text>
  
  <!-- Subtle accent bar -->
  <line x1="0" y1="480" x2="960" y2="480" stroke="#7E57C2" stroke-width="3" opacity="0.3"/>
</svg>