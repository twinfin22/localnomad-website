name: SEO Weekly Pulse

on:
  workflow_dispatch:       # Manual trigger only; scheduled Telegram alerts disabled

jobs:
  seo-pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GSC dependencies
        run: npm install @googleapis/searchconsole google-auth-library

      - name: Write GSC service account key
        env:
          GSC_SA_KEY_JSON: ${{ secrets.GSC_SA_KEY_JSON }}
        run: |
          echo "$GSC_SA_KEY_JSON" > /tmp/gsc-sa-key.json

      - name: Pull GSC data
        id: gsc
        env:
          GSC_SA_KEY_PATH: /tmp/gsc-sa-key.json
          GSC_SITE_URL: https://localnomad.club/
        run: |
          GSC_DATA=$(node scripts/seo/pull-gsc.mjs 2>&1) || {
            echo "pull-gsc failed"
            echo "error=true" >> $GITHUB_OUTPUT
            exit 0
          }
          echo "$GSC_DATA" > /tmp/gsc-data.json
          ROW_COUNT=$(echo "$GSC_DATA" | jq '.meta.rowCount // 0')
          echo "rows=$ROW_COUNT" >> $GITHUB_OUTPUT

      - name: Format summary for Telegram
        if: steps.gsc.outputs.error != 'true' && steps.gsc.outputs.rows != '0'
        run: |
          cat > /tmp/format-seo.mjs << 'SCRIPT'
          import { readFileSync, writeFileSync } from 'fs';
          const data = JSON.parse(readFileSync('/tmp/gsc-data.json', 'utf8'));
          const meta = data.meta;
          const byQuery = {};
          for (const r of data.rows) {
            if (!byQuery[r.query]) byQuery[r.query] = { clicks: 0, impressions: 0, positions: [], count: 0 };
            byQuery[r.query].clicks += r.clicks;
            byQuery[r.query].impressions += r.impressions;
            byQuery[r.query].positions.push(r.position);
            byQuery[r.query].count++;
          }
          const avgPos = (d) => (d.positions.reduce((a,b) => a+b, 0) / d.positions.length);
          const all = Object.entries(byQuery).map(([q, d]) => ({
            query: q, clicks: d.clicks, impressions: d.impressions,
            pos: avgPos(d),
          }));
          const totalClicks = all.reduce((s, d) => s + d.clicks, 0);
          const totalImpr = all.reduce((s, d) => s + d.impressions, 0);
          const avgCtr = totalImpr > 0 ? (totalClicks / totalImpr * 100).toFixed(1) : '0.0';
          const striking = all
            .filter(q => q.pos >= 4 && q.pos <= 10 && q.impressions >= 5)
            .sort((a, b) => b.impressions - a.impressions)
            .slice(0, 5);
          const top5 = [...all].sort((a, b) => b.impressions - a.impressions).slice(0, 5);
          const bestPos = [...all].filter(q => q.pos <= 3 && q.impressions > 0)
            .sort((a, b) => a.pos - b.pos).slice(0, 3);
          const trunc = (s, n) => s.length > n ? s.slice(0, n) + '...' : s;

          let msg = `📊 <b>SEO Weekly Pulse</b>\n`;
          msg += `${meta.startDate} → ${meta.endDate.slice(5)} (${meta.days}d)\n\n`;
          msg += `👁 ${totalImpr} impressions · 👆 ${totalClicks} clicks · CTR ${avgCtr}%\n`;
          msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
          if (striking.length > 0) {
            msg += `\n⚡ <b>Quick Wins (rank 4-10)</b>\n`;
            striking.forEach((q, i) => {
              msg += `${i+1}. ${trunc(q.query, 40)}\n   ${q.impressions} impr · pos ${q.pos.toFixed(1)}\n`;
            });
          }
          msg += `\n📋 <b>Top Queries</b>\n`;
          top5.forEach((q, i) => {
            const label = q.pos <= 3 ? ' ← top 3!' : '';
            msg += `${i+1}. ${trunc(q.query, 40)}  ${q.impressions} impr${label}\n`;
          });
          if (bestPos.length > 0) {
            msg += `\n🏆 <b>Best Positions</b>\n`;
            bestPos.forEach(q => {
              msg += `pos ${q.pos.toFixed(1)} · ${trunc(q.query, 40)} (${q.impressions} impr)\n`;
            });
          }
          msg += `\n<i>${meta.rowCount} rows · ${new Date().toISOString().slice(0,10)}</i>`;
          writeFileSync('/tmp/telegram-msg.txt', msg);
          SCRIPT
          node /tmp/format-seo.mjs

      - name: Send to Telegram
        if: steps.gsc.outputs.error != 'true' && steps.gsc.outputs.rows != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(cat /tmp/telegram-msg.txt)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null

      - name: Send error notification
        if: steps.gsc.outputs.error == 'true' || steps.gsc.outputs.rows == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ SEO Pulse failed — GSC returned 0 rows or pull-gsc errored. Check GitHub Actions log." > /dev/null

      - name: Cleanup
        if: always()
        run: rm -f /tmp/gsc-sa-key.json /tmp/gsc-data.json
