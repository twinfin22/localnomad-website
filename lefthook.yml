# https://github.com/evilmartians/lefthook
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,mjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    blog-links:
      glob: "*.mdx"
      run: bash scripts/validate-blog-links.sh {staged_files}

pre-push:
  commands:
    typecheck:
      run: npx tsc --noEmit
